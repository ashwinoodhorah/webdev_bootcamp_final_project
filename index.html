<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homescreen-Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
          <a class="navbar-brand" href="#">Football Journal</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse w-100 gap-4"
            id="navbarSupportedContent"
          >
            <ul class="navbar-nav mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#"
                  >Dashboard</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Matches</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Analyses</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Stats</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero-section">
        <div class="container mt-3 bg-black hero-container">
          <h2 class="welcome-msg">Welcome back, USER.</h2>
          <h3 class="cta-msg">Ready for your next analysis?</h3>
          <button type="button" class="btn btn-primary cta-btn">
            Explore Matches
          </button>
        </div>
      </section>

      <section class="recent-activities">
        <div class="recent-card">
          <img
            class="club-logo"
            src="assets/images/club_logos/england_liverpool.football-logos.cc.svg"
            alt="liverpool club official logo"
          />
          <a href="#">Liverpool</a>
          vs
          <a href="#">Barcelona</a>
          <img
            class="club-logo"
            src="assets/images/club_logos/barcelona.svg"
            alt="liverpool club official logo"
          />
        </div>
      </section>
    </main>

    <footer class="site-footer"></footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
